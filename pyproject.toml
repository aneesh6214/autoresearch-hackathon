[project]
name = "autoresearch-hackathon"
version = "0.1.0"
description = "Autoresearch loop for optimizing AI tutor strategies."
requires-python = ">=3.11"
dependencies = [
  "modal>=1.0.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "datasets>=4.8.5",
  "huggingface-hub>=1.17.0",
  "pandas>=3.0.3",
  "requests>=2.34.2",
  "pillow>=12.2.0",
  "fastapi>=0.136.3",
  "uvicorn>=0.48.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
